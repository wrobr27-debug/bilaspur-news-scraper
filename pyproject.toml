[project]
name = "bilaspur-news-scraper"
version = "0.1.0"
description = "Bilaspur News Scraper v1 - news collection and storage engine (registry Phase 0)"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "Pydantic>=2.5",
    "openpyxl>=3.1",
    "crawlee[httpx]>=1.11,<2",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bilaspur-scraper = "bilaspur_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
